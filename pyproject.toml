[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schemap-tool"
version = "4.0.1"
description = "Local semantic compiler for AI agents working with databases. Compiles schema semantics and invariants into deterministic context; verifies generated SQL."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Swarty", email = "ramrunner13@gmail.com" }
]
keywords = [
    "postgres",
    "ai",
    "schemap",
    "claude",
    "cursor",
    "text-to-sql",
    "mcp-server",
    "semantic-layer",
    "sql-guardrails",
    "data-governance",
    "deterministic-sql"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.6.0",
    "jinja2>=3.1.0",
    "psycopg[binary]>=3.1.0",
    "pyyaml>=6.0.0",
    "libsql",
    "tiktoken>=0.6.0",
    "watchdog>=4.0.0",
    "pymysql",
    "oracledb",
    "questionary>=2.0.0",
    "sqlglot>=23.0.0"
]

[project.urls]
Homepage = "https://schemap-tool.pages.dev/"
Documentation = "https://schemap-tool.pages.dev/#features"
Repository = "https://github.com/alansyahmi/Schemap"
Changelog = "https://github.com/alansyahmi/Schemap/releases"
"Bug Tracker" = "https://github.com/alansyahmi/Schemap/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.10.0",
    "fastapi>=0.100.0",
    "httpx>=0.25.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "stripe>=8.0.0",
    "resend>=0.8.0",
    "numpy>=1.24.0"
]
enrich = [
    "openai>=1.14.0"
]

[project.scripts]
schemap = "schemap.cli:cli"
schemap-tool = "schemap.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["schemap"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".github",
    "assets/*",
    "dist",
    "dist-rebuilt",
    "docs/*",
    "server/*",
    "video_assets/*",
    "worker/*",
    "uv.lock",
    "schemap_semantic.json",
    "*.mp4",
    "*.webm",
    "*.png",
    "*.zip",
]




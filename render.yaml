services:
  - type: web
    name: schemap-license-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SERVER_PEPPER
        generateValue: true
      - key: FROM_EMAIL
        value: Schemap <licenses@schemap.com>
      - key: PRICE_MONTHLY_ID
        sync: false
      - key: PRICE_QUARTERLY_ID
        sync: false
      - key: PRICE_SEMIANNUAL_ID
        sync: false
      - key: PRICE_ANNUAL_ID
        sync: false
      - key: PRICE_LIFETIME_ID
        sync: false
